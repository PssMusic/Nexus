<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus 3D | Link Manager</title>
    
    <link id="pwa-manifest" rel="manifest" href="">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus 3D">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        secondary: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea' },
                        accent: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
                        surface: { 
                            light: '#ffffff', 
                            dark: '#0f0f23',
                            card: '#1a1a2e'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'slide-in-3d': 'slideIn3D 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'tilt': 'tilt 0.4s ease-out'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotateX(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotateX(5deg)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.5)' },
                            '50%': { boxShadow: '0 0 40px rgba(99, 102, 241, 0.8)' }
                        },
                        slideIn3D: {
                            '0%': { opacity: '0', transform: 'translateZ(-100px) translateY(50px) rotateX(-15deg)' },
                            '100%': { opacity: '1', transform: 'translateZ(0) translateY(0) rotateX(0)' }
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        tilt: {
                            '0%': { transform: 'rotateX(0deg) rotateY(0deg)' },
                            '25%': { transform: 'rotateX(5deg) rotateY(-5deg)' },
                            '50%': { transform: 'rotateX(0deg) rotateY(0deg)' },
                            '75%': { transform: 'rotateX(-5deg) rotateY(5deg)' },
                            '100%': { transform: 'rotateX(0deg) rotateY(0deg)' }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #2dd4bf 100%);
            --card-gradient-light: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(248,250,252,0.7));
            --card-gradient-dark: linear-gradient(145deg, rgba(30,30,50,0.95), rgba(15,15,35,0.8));
            --glass-border-light: rgba(255, 255, 255, 0.3);
            --glass-border-dark: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            perspective: 1000px;
            transition: background 0.5s ease;
        }

        /* Fondo 3D Animado */
        .bg-3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 400px;
            height: 400px;
            background: #6366f1;
            top: -100px;
            right: -100px;
        }

        .bg-orb-2 {
            width: 300px;
            height: 300px;
            background: #a855f7;
            bottom: -50px;
            left: -50px;
            animation-delay: -2s;
        }

        .bg-orb-3 {
            width: 250px;
            height: 250px;
            background: #2dd4bf;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -4s;
        }

        /* Efectos 3D para tarjetas */
        .card-3d {
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateZ(0);
        }

        .card-3d:hover {
            transform: translateZ(20px) rotateX(5deg) rotateY(-5deg);
            box-shadow: 
                0 25px 50px -12px rgba(99, 102, 241, 0.4),
                0 10px 20px -5px rgba(168, 85, 247, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .card-3d::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--primary-gradient);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            filter: blur(20px);
        }

        .card-3d:hover::before {
            opacity: 0.3;
        }

        /* Glassmorphism mejorado */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .dark .glass-panel {
            background: rgba(15, 15, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Botones 3D */
        .btn-3d {
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.2s ease;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            transform: translateZ(-4px);
            border-radius: inherit;
            filter: brightness(0.7);
            transition: transform 0.2s ease;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
        }

        .btn-3d:active::after {
            transform: translateZ(-2px);
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #a855f7);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #818cf8, #c084fc);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        /* Gradientes de texto */
        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        /* Iconos flotantes */
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }

        /* Sidebar responsive */
        @media (max-width: 1024px) {
            #sidebar {
                transform: translateX(-100%);
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            #sidebar-overlay {
                display: none;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            #sidebar-overlay.open {
                display: block;
                opacity: 1;
            }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.05) 25%, 
                rgba(255,255,255,0.1) 50%, 
                rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Tooltip 3D */
        .tooltip-3d {
            position: relative;
        }

        .tooltip-3d::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateZ(10px);
            background: rgba(15, 15, 35, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tooltip-3d:hover::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateZ(20px);
        }

        /* Checkbox personalizado 3D */
        .checkbox-3d {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #6366f1;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .checkbox-3d:checked {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .checkbox-3d:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Modal con efecto 3D */
        .modal-3d {
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .modal-content-3d {
            transform: rotateX(10deg) translateZ(-50px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-active .modal-content-3d {
            transform: rotateX(0deg) translateZ(0);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-surface-dark dark:text-slate-100 min-h-screen antialiased selection:bg-primary-500 selection:text-white">

    <!-- Fondo 3D Animado -->
    <div class="bg-3d">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Overlay para sidebar móvil -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar 3D -->
    <aside id="sidebar" class="glass-panel fixed lg:static inset-y-0 left-0 z-50 w-80 flex flex-col justify-between shadow-2xl transition-transform duration-500">
        <div class="flex flex-col h-full">
            <!-- Logo 3D -->
            <div class="h-20 flex items-center px-6 border-b border-white/10 shrink-0 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-primary-500/10 to-secondary-500/10"></div>
                <div class="relative z-10 flex items-center">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary-500 to-secondary-500 flex items-center justify-center shadow-lg floating-icon">
                        <i class="ph-fill ph-cube text-white text-2xl"></i>
                    </div>
                    <div class="ml-4">
                        <h1 class="text-2xl font-bold gradient-text tracking-tight">Nexus 3D</h1>
                        <p class="text-xs text-slate-400">Link Manager</p>
                    </div>
                </div>
                <button class="lg:hidden ml-auto text-slate-400 hover:text-white transition-colors z-10" onclick="toggleSidebar()">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>

            <!-- Stats 3D -->
            <div class="px-6 py-6 border-b border-white/10 grid grid-cols-2 gap-4 shrink-0">
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10 hover:border-primary-500/50 transition-all hover:shadow-lg hover:shadow-primary-500/20 group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="ph ph-link text-white"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400">Total</p>
                            <p id="stat-total" class="font-bold text-2xl gradient-text">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/10 hover:border-amber-500/50 transition-all hover:shadow-lg hover:shadow-amber-500/20 group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-amber-400 to-amber-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i class="ph-fill ph-star text-white"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400">Favoritos</p>
                            <p id="stat-favs" class="font-bold text-2xl text-amber-400">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Categorías -->
            <div class="flex-1 overflow-y-auto py-4 px-4 flex flex-col gap-2" id="categories-container">
                <!-- Se llena dinámicamente -->
            </div>

            <!-- Acciones inferiores -->
            <div class="p-4 border-t border-white/10 space-y-3 shrink-0">
                <button onclick="openModal('category-modal')" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold rounded-xl bg-gradient-to-r from-primary-500 to-secondary-500 text-white hover:shadow-lg hover:shadow-primary-500/30 transition-all btn-3d">
                    <i class="ph ph-plus-circle text-lg"></i> Nueva Categoría
                </button>
                <div class="flex gap-2">
                    <button onclick="exportData()" class="flex-1 flex justify-center items-center px-4 py-3 text-sm font-semibold rounded-xl bg-white/10 hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Exportar">
                        <i class="ph ph-download-simple text-lg"></i>
                    </button>
                    <button onclick="document.getElementById('import-file').click()" class="flex-1 flex justify-center items-center px-4 py-3 text-sm font-semibold rounded-xl bg-white/10 hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Importar">
                        <i class="ph ph-upload-simple text-lg"></i>
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                    </button>
                    <button onclick="toggleTheme()" class="flex-1 flex justify-center items-center px-4 py-3 text-sm font-semibold rounded-xl bg-white/10 hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Tema" id="theme-toggle-btn">
                        <i class="ph ph-moon-stars text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col relative w-full h-full overflow-hidden">
        
        <!-- Header 3D -->
        <header class="h-20 flex items-center justify-between px-6 lg:px-10 border-b border-white/10 glass-panel z-30 shrink-0">
            <div class="flex items-center gap-4 flex-1">
                <button class="lg:hidden text-slate-400 hover:text-primary-400 transition-colors" onclick="toggleSidebar()">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                
                <!-- Búsqueda 3D -->
                <div class="relative w-full max-w-lg group">
                    <div class="absolute inset-0 bg-gradient-to-r from-primary-500/20 to-secondary-500/20 rounded-full blur opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                    <div class="relative flex items-center">
                        <i class="ph ph-magnifying-glass absolute left-4 text-slate-400 group-focus-within:text-primary-400 transition-colors text-xl"></i>
                        <input type="text" id="search-input" placeholder="Buscar enlaces..." class="w-full bg-white/10 border border-white/20 focus:border-primary-500/50 rounded-full py-3 pl-12 pr-4 outline-none transition-all dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary-500/30 backdrop-blur-sm">
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="install-btn" class="hidden items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-primary-500 to-secondary-500 text-white text-sm font-semibold rounded-full hover:shadow-lg hover:shadow-primary-500/30 transition-all btn-3d">
                    <i class="ph ph-download-simple"></i> <span class="hidden sm:inline">Instalar</span>
                </button>
                <button onclick="openModal('link-modal')" class="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-primary-500 via-secondary-500 to-accent-500 text-white text-sm font-semibold rounded-full hover:shadow-xl hover:shadow-primary-500/40 transition-all transform hover:-translate-y-1 btn-3d animate-pulse-glow">
                    <i class="ph ph-plus-bold"></i> <span class="hidden sm:inline">Nuevo Enlace</span>
                </button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="px-6 lg:px-10 py-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shrink-0 z-20">
            <div>
                <h2 id="current-category-title" class="text-3xl font-bold gradient-text mb-1">Todos los enlaces</h2>
                <p class="text-slate-400 text-sm">Gestiona tus favoritos en 3D</p>
            </div>
            
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <!-- Ordenar -->
                <div class="relative flex-1 sm:flex-none">
                    <select id="sort-select" onchange="renderLinks()" class="w-full appearance-none bg-white/10 border border-white/20 rounded-xl py-3 pl-4 pr-12 text-sm outline-none focus:ring-2 focus:ring-primary-500/50 cursor-pointer backdrop-blur-sm transition-all hover:bg-white/15">
                        <option value="recent">Más recientes</option>
                        <option value="az">A-Z</option>
                        <option value="za">Z-A</option>
                        <option value="fav">Favoritos</option>
                    </select>
                    <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>

                <!-- Vistas -->
                <div class="flex bg-white/10 rounded-xl p-1.5 backdrop-blur-sm border border-white/10">
                    <button onclick="setViewMode('cards')" id="view-cards" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Tarjetas">
                        <i class="ph ph-squares-four text-xl"></i>
                    </button>
                    <button onclick="setViewMode('compact')" id="view-compact" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Lista">
                        <i class="ph ph-list-dashes text-xl"></i>
                    </button>
                    <button onclick="setViewMode('buttons')" id="view-buttons" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/20 transition-all tooltip-3d" data-tooltip="Botones">
                        <i class="ph ph-dots-nine text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Área de Links -->
        <div id="links-scroll-area" class="flex-1 overflow-y-auto px-6 lg:px-10 pb-8">
            <div id="links-container" class="grid gap-6">
                <!-- Links renderizados vía JS -->
            </div>
            
            <!-- Estado vacío -->
            <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-center py-20">
                <div class="w-32 h-32 rounded-full bg-gradient-to-br from-primary-500/20 to-secondary-500/20 flex items-center justify-center mb-6 border border-white/10 animate-float">
                    <i class="ph ph-link-break text-5xl text-slate-400"></i>
                </div>
                <h3 class="text-2xl font-bold mb-3 gradient-text">No hay enlaces aquí</h3>
                <p class="text-slate-400 max-w-md mb-8">Comienza agregando tus primeros sitios favoritos. ¡Hazlo con estilo!</p>
                <button onclick="openModal('link-modal')" class="px-8 py-4 bg-gradient-to-r from-primary-500 to-secondary-500 text-white font-semibold rounded-2xl hover:shadow-xl hover:shadow-primary-500/40 transition-all btn-3d">
                    Agregar primer enlace
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Agregar/Editar Link -->
    <div id="link-modal" class="fixed inset-0 z-[100] hidden modal-3d">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md transition-opacity opacity-0" id="link-modal-backdrop" onclick="closeModal('link-modal')"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass-panel relative w-full max-w-lg rounded-3xl p-8 shadow-2xl modal-content-3d border border-white/20">
                <div class="absolute -top-2 -right-2 w-20 h-20 bg-gradient-to-br from-primary-500 to-secondary-500 rounded-full blur-2xl opacity-30"></div>
                <div class="absolute -bottom-2 -left-2 w-20 h-20 bg-gradient-to-br from-accent-500 to-primary-500 rounded-full blur-2xl opacity-30"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-2xl font-bold gradient-text" id="link-modal-title">Nuevo Enlace</h3>
                        <button onclick="closeModal('link-modal')" class="w-10 h-10 rounded-full bg-white/10 hover:bg-red-500/20 flex items-center justify-center transition-all">
                            <i class="ph ph-x text-xl"></i>
                        </button>
                    </div>
                    
                    <input type="hidden" id="link-id">
                    
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">URL del sitio *</label>
                            <div class="relative group">
                                <div class="absolute inset-0 bg-gradient-to-r from-primary-500/20 to-secondary-500/20 rounded-xl blur opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                                <div class="relative flex items-center">
                                    <input type="url" id="link-url" class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 px-5 outline-none focus:ring-2 focus:ring-primary-500/50 backdrop-blur-sm transition-all" placeholder="https://ejemplo.com" required onblur="autoExtractData()">
                                    <button onclick="pasteFromClipboard()" class="absolute right-3 p-2 text-slate-400 hover:text-primary-400 transition-colors tooltip-3d" data-tooltip="Pegar">
                                        <i class="ph ph-clipboard-text text-xl"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">Título</label>
                            <input type="text" id="link-title" class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 px-5 outline-none focus:ring-2 focus:ring-primary-500/50 backdrop-blur-sm transition-all" placeholder="Nombre descriptivo">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">Descripción</label>
                            <textarea id="link-desc" rows="2" class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 px-5 outline-none focus:ring-2 focus:ring-primary-500/50 backdrop-blur-sm transition-all resize-none" placeholder="Breve descripción..."></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-slate-300">Categoría</label>
                                <select id="link-category" class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 px-5 outline-none focus:ring-2 focus:ring-primary-500/50 backdrop-blur-sm transition-all appearance-none cursor-pointer">
                                    <!-- Dinámico -->
                                </select>
                            </div>
                            
                            <div class="flex items-end">
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="checkbox" id="link-favorite" class="checkbox-3d">
                                    <span class="text-sm font-medium text-slate-300 group-hover:text-amber-400 transition-colors">Marcar como favorito</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button onclick="closeModal('link-modal')" class="flex-1 px-6 py-3.5 bg-white/10 hover:bg-white/20 rounded-xl font-semibold transition-all btn-3d">
                            Cancelar
                        </button>
                        <button onclick="saveLink()" class="flex-1 px-6 py-3.5 bg-gradient-to-r from-primary-500 to-secondary-500 text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-primary-500/30 transition-all btn-3d">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Categoría -->
    <div id="category-modal" class="fixed inset-0 z-[100] hidden modal-3d">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md transition-opacity opacity-0" id="category-modal-backdrop" onclick="closeModal('category-modal')"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass-panel relative w-full max-w-md rounded-3xl p-8 shadow-2xl modal-content-3d border border-white/20">
                <div class="absolute -top-2 -right-2 w-20 h-20 bg-gradient-to-br from-secondary-500 to-accent-500 rounded-full blur-2xl opacity-30"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-2xl font-bold gradient-text">Nueva Categoría</h3>
                        <button onclick="closeModal('category-modal')" class="w-10 h-10 rounded-full bg-white/10 hover:bg-red-500/20 flex items-center justify-center transition-all">
                            <i class="ph ph-x text-xl"></i>
                        </button>
                    </div>
                    
                    <input type="hidden" id="category-id">
                    
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">Nombre *</label>
                            <div class="relative group">
                                <div class="absolute inset-0 bg-gradient-to-r from-secondary-500/20 to-accent-500/20 rounded-xl blur opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                                <input type="text" id="category-name" class="w-full bg-white/10 border border-white/20 rounded-xl py-3.5 px-5 outline-none focus:ring-2 focus:ring-secondary-500/50 backdrop-blur-sm transition-all relative z-10" placeholder="Ej: Trabajo, Personal..." required>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">Icono</label>
                            <div class="grid grid-cols-6 gap-2" id="category-icons">
                                <!-- Iconos generados dinámicamente -->
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-slate-300">Color</label>
                            <div class="flex flex-wrap gap-3" id="category-colors">
                                <!-- Colores generados dinámicamente -->
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-8">
                        <button onclick="closeModal('category-modal')" class="flex-1 px-6 py-3.5 bg-white/10 hover:bg-white/20 rounded-xl font-semibold transition-all btn-3d">
                            Cancelar
                        </button>
                        <button onclick="saveCategory()" class="flex-1 px-6 py-3.5 bg-gradient-to-r from-secondary-500 to-accent-500 text-white rounded-xl font-semibold hover:shadow-lg hover:shadow-secondary-500/30 transition-all btn-3d">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-[150] flex flex-col gap-3"></div>

    <script>
        // ============================================
        // ESTADO DE LA APLICACIÓN
        // ============================================
        let state = {
            links: [],
            categories: [
                { id: 'all', name: 'Todos', icon: 'ph-grid-four', color: '#6366f1' },
                { id: 'favorites', name: 'Favoritos', icon: 'ph-star', color: '#f59e0b' }
            ],
            currentCategory: 'all',
            viewMode: 'cards',
            sortBy: 'recent',
            searchQuery: '',
            isDark: true,
            draggedItem: null
        };

        const ICONS = [
            'ph-globe', 'ph-folder', 'ph-briefcase', 'ph-heart', 'ph-star', 
            'ph-bookmark', 'ph-code', 'ph-game-controller', 'ph-music-notes',
            'ph-film-strip', 'ph-shopping-cart', 'ph-newspaper', 'ph-chat-circle',
            'ph-image', 'ph-video', 'ph-calendar', 'ph-clock', 'ph-lightbulb'
        ];

        const COLORS = [
            '#6366f1', '#a855f7', '#ec4899', '#f59e0b', '#22c55e',
            '#14b8a6', '#3b82f6', '#ef4444', '#8b5cf6', '#06b6d4'
        ];

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            initTheme();
            setupEventListeners();
            renderCategories();
            renderLinks();
            updateStats();
            initCategoryIcons();
            initCategoryColors();
            registerServiceWorker();
        });

        function loadState() {
            try {
                const saved = localStorage.getItem('nexus3d_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error('Error loading state:', e);
            }
        }

        function saveState() {
            localStorage.setItem('nexus3d_state', JSON.stringify(state));
        }

        function initTheme() {
            if (state.isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            document.documentElement.classList.toggle('dark');
            updateThemeIcon();
            saveState();
        }

        function updateThemeIcon() {
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.innerHTML = state.isDark 
                    ? '<i class="ph ph-sun text-lg"></i>' 
                    : '<i class="ph ph-moon-stars text-lg"></i>';
            }
        }

        function setupEventListeners() {
            // Búsqueda
            document.getElementById('search-input').addEventListener('input', (e) => {
                state.searchQuery = e.target.value.toLowerCase();
                renderLinks();
            });

            // Teclas rápidas
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
                if (e.key === 'Escape') {
                    closeModal('link-modal');
                    closeModal('category-modal');
                }
                if (e.key === 'n' && e.ctrlKey) {
                    e.preventDefault();
                    openModal('link-modal');
                }
            });

            // PWA Install
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBtn = document.getElementById('install-btn');
                if (installBtn) {
                    installBtn.classList.remove('hidden');
                    installBtn.classList.add('flex');
                }
            });

            document.getElementById('install-btn')?.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        showToast('¡App instalada!', 'success');
                    }
                    deferredPrompt = null;
                }
            });
        }

        // ============================================
        // RENDERIZADO
        // ============================================
        function renderCategories() {
            const container = document.getElementById('categories-container');
            if (!container) return;

            container.innerHTML = state.categories.map(cat => `
                <button 
                    onclick="selectCategory('${cat.id}')"
                    class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group ${
                        state.currentCategory === cat.id 
                            ? 'bg-gradient-to-r from-primary-500/20 to-secondary-500/20 border border-primary-500/30' 
                            : 'hover:bg-white/5 border border-transparent'
                    }"
                >
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center transition-all group-hover:scale-110" style="background: ${cat.color}20; color: ${cat.color}">
                        <i class="ph ${cat.icon} text-xl"></i>
                    </div>
                    <span class="font-medium flex-1 text-left">${cat.name}</span>
                    ${cat.id !== 'all' && cat.id !== 'favorites' ? `
                        <button onclick="event.stopPropagation(); editCategory('${cat.id}')" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-white/10 rounded-lg transition-all">
                            <i class="ph ph-pencil-simple text-sm"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteCategory('${cat.id}')" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-red-500/20 rounded-lg transition-all text-red-400">
                            <i class="ph ph-trash text-sm"></i>
                        </button>
                    ` : ''}
                </button>
            `).join('');
        }

        function selectCategory(id) {
            state.currentCategory = id;
            renderCategories();
            renderLinks();
            
            const cat = state.categories.find(c => c.id === id);
            document.getElementById('current-category-title').textContent = cat?.name || 'Todos los enlaces';
            
            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            const emptyState = document.getElementById('empty-state');
            
            if (!container) return;

            let filtered = [...state.links];

            // Filtrar por categoría
            if (state.currentCategory === 'favorites') {
                filtered = filtered.filter(l => l.favorite);
            } else if (state.currentCategory !== 'all') {
                filtered = filtered.filter(l => l.category === state.currentCategory);
            }

            // Filtrar por búsqueda
            if (state.searchQuery) {
                filtered = filtered.filter(l => 
                    l.title.toLowerCase().includes(state.searchQuery) ||
                    l.url.toLowerCase().includes(state.searchQuery) ||
                    (l.description && l.description.toLowerCase().includes(state.searchQuery))
                );
            }

            // Ordenar
            switch (state.sortBy) {
                case 'az':
                    filtered.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'za':
                    filtered.sort((a, b) => b.title.localeCompare(a.title));
                    break;
                case 'fav':
                    filtered.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0));
                    break;
                default:
                    filtered.sort((a, b) => b.createdAt - a.createdAt);
            }

            updateStats();

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState?.classList.remove('hidden');
                emptyState?.classList.add('flex');
                return;
            }

            emptyState?.classList.add('hidden');
            emptyState?.classList.remove('flex');

            const viewClass = getViewClass();
            container.className = `grid gap-6 ${viewClass}`;

            container.innerHTML = filtered.map((link, index) => {
                const category = state.categories.find(c => c.id === link.category);
                const delay = Math.min(index * 0.05, 0.5);
                
                return createLinkCard(link, category, delay);
            }).join('');

            // Añadir eventos de drag & drop si es vista de tarjetas
            if (state.viewMode === 'cards') {
                initDragAndDrop();
            }
        }

        function getViewClass() {
            switch (state.viewMode) {
                case 'compact':
                    return 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3';
                case 'buttons':
                    return 'grid-cols-2 md:grid-cols-4 lg:grid-cols-6';
                default:
                    return 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4';
            }
        }

        function createLinkCard(link, category, delay = 0) {
            const domain = new URL(link.url).hostname.replace('www.', '');
            const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
            
            const baseClasses = `card-3d relative overflow-hidden rounded-2xl cursor-pointer group animate-slide-in-3d`;
            const bgClasses = state.viewMode === 'buttons' 
                ? 'bg-white/5 border border-white/10 p-4 text-center'
                : 'glass-panel p-6';

            setTimeout(() => {
                const el = document.querySelector(`[data-link-id="${link.id}"]`);
                if (el) {
                    el.style.animationDelay = `${delay}s`;
                }
            }, 0);

            if (state.viewMode === 'buttons') {
                return `
                    <div data-link-id="${link.id}" class="${baseClasses} ${bgClasses}" 
                         onclick="openLink('${link.url}')"
                         draggable="true">
                        <div class="w-12 h-12 mx-auto mb-3 rounded-xl flex items-center justify-center overflow-hidden" style="background: ${category?.color}20">
                            <img src="${favicon}" alt="" class="w-8 h-8" onerror="this.parentElement.innerHTML='<i class=\'ph ph-globe\' style=\'color: ${category?.color}\'></i>'">
                        </div>
                        <p class="font-semibold text-sm truncate">${link.title || domain}</p>
                        ${link.favorite ? '<i class="ph-fill ph-star text-amber-400 text-xs mt-1"></i>' : ''}
                    </div>
                `;
            }

            if (state.viewMode === 'compact') {
                return `
                    <div data-link-id="${link.id}" class="${baseClasses} ${bgClasses} hover:border-primary-500/30 transition-all" 
                         onclick="openLink('${link.url}')"
                         draggable="true">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center overflow-hidden shrink-0" style="background: ${category?.color}20">
                                <img src="${favicon}" alt="" class="w-7 h-7" onerror="this.parentElement.innerHTML='<i class=\'ph ph-globe\' style=\'color: ${category?.color}; font-size: 24px\'></i>'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold truncate group-hover:text-primary-400 transition-colors">${link.title || domain}</h3>
                                <p class="text-sm text-slate-400 truncate">${link.description || link.url}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); toggleFavorite('${link.id}')" class="p-2 rounded-lg hover:bg-white/10 transition-all ${link.favorite ? 'text-amber-400' : 'text-slate-400'}">
                                    <i class="${link.favorite ? 'ph-fill' : 'ph'} ph-star text-lg"></i>
                                </button>
                                <button onclick="event.stopPropagation(); editLink('${link.id}')" class="p-2 rounded-lg hover:bg-white/10 transition-all text-slate-400">
                                    <i class="ph ph-pencil-simple text-lg"></i>
                                </button>
                                <button onclick="event.stopPropagation(); deleteLink('${link.id}')" class="p-2 rounded-lg hover:bg-red-500/20 transition-all text-red-400">
                                    <i class="ph ph-trash text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Vista de tarjetas (default)
            return `
                <div data-link-id="${link.id}" class="${baseClasses} ${bgClasses} group" 
                     onclick="openLink('${link.url}')"
                     draggable="true">
                    <div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                        <div class="flex gap-2">
                            <button onclick="event.stopPropagation(); toggleFavorite('${link.id}')" class="p-2 rounded-lg bg-black/50 hover:bg-amber-500/20 backdrop-blur-sm transition-all ${link.favorite ? 'text-amber-400' : 'text-white'}">
                                <i class="${link.favorite ? 'ph-fill' : 'ph'} ph-star"></i>
                            </button>
                            <button onclick="event.stopPropagation(); editLink('${link.id}')" class="p-2 rounded-lg bg-black/50 hover:bg-white/20 backdrop-blur-sm transition-all text-white">
                                <i class="ph ph-pencil-simple"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteLink('${link.id}')" class="p-2 rounded-lg bg-black/50 hover:bg-red-500/20 backdrop-blur-sm transition-all text-white">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-14 h-14 rounded-xl flex items-center justify-center overflow-hidden shadow-lg shrink-0" style="background: ${category?.color}20">
                            <img src="${favicon}" alt="" class="w-9 h-9" onerror="this.parentElement.innerHTML='<i class=\'ph ph-globe\' style=\'color: ${category?.color}; font-size: 32px\'></i>'">
                        </div>
                        <div class="flex-1 min-w-0 pt-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 rounded-md text-xs font-medium" style="background: ${category?.color}20; color: ${category?.color}">
                                    ${category?.name || 'General'}
                                </span>
                                ${link.favorite ? '<i class="ph-fill ph-star text-amber-400 text-sm"></i>' : ''}
                            </div>
                            <h3 class="font-bold text-lg truncate group-hover:text-primary-400 transition-colors">${link.title || domain}</h3>
                        </div>
                    </div>
                    
                    ${link.description ? `<p class="text-slate-400 text-sm line-clamp-2 mb-4">${link.description}</p>` : ''}
                    
                    <div class="flex items-center justify-between pt-4 border-t border-white/10">
                        <span class="text-xs text-slate-500 truncate flex-1">${domain}</span>
                        <span class="text-xs text-slate-500 ml-2">${formatDate(link.createdAt)}</span>
                    </div>
                </div>
            `;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = state.links.length;
            document.getElementById('stat-favs').textContent = state.links.filter(l => l.favorite).length;
        }

        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleDateString('es-ES', {
                day: 'numeric',
                month: 'short'
            });
        }

        // ============================================
        // GESTIÓN DE LINKS
        // ============================================
        function openLink(url) {
            window.open(url, '_blank');
        }

        function saveLink() {
            const id = document.getElementById('link-id').value;
            const url = document.getElementById('link-url').value.trim();
            const title = document.getElementById('link-title').value.trim();
            const description = document.getElementById('link-desc').value.trim();
            const category = document.getElementById('link-category').value;
            const favorite = document.getElementById('link-favorite').checked;

            if (!url) {
                showToast('La URL es requerida', 'error');
                return;
            }

            try {
                new URL(url);
            } catch {
                showToast('URL inválida', 'error');
                return;
            }

            if (id) {
                // Editar existente
                const index = state.links.findIndex(l => l.id === id);
                if (index !== -1) {
                    state.links[index] = {
                        ...state.links[index],
                        url,
                        title: title || new URL(url).hostname,
                        description,
                        category,
                        favorite,
                        updatedAt: Date.now()
                    };
                    showToast('Enlace actualizado', 'success');
                }
            } else {
                // Nuevo
                const newLink = {
                    id: crypto.randomUUID(),
                    url,
                    title: title || new URL(url).hostname,
                    description,
                    category: category || 'all',
                    favorite,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                state.links.unshift(newLink);
                showToast('Enlace guardado', 'success');
            }

            saveState();
            closeModal('link-modal');
            renderLinks();
        }

        function editLink(id) {
            const link = state.links.find(l => l.id === id);
            if (!link) return;

            document.getElementById('link-id').value = link.id;
            document.getElementById('link-url').value = link.url;
            document.getElementById('link-title').value = link.title;
            document.getElementById('link-desc').value = link.description || '';
            document.getElementById('link-category').value = link.category;
            document.getElementById('link-favorite').checked = link.favorite;
            document.getElementById('link-modal-title').textContent = 'Editar Enlace';

            openModal('link-modal');
        }

        function deleteLink(id) {
            if (!confirm('¿Eliminar este enlace?')) return;
            
            state.links = state.links.filter(l => l.id !== id);
            saveState();
            renderLinks();
            showToast('Enlace eliminado', 'success');
        }

        function toggleFavorite(id) {
            const link = state.links.find(l => l.id === id);
            if (link) {
                link.favorite = !link.favorite;
                saveState();
                renderLinks();
            }
        }

        async function autoExtractData() {
            const urlInput = document.getElementById('link-url');
            const titleInput = document.getElementById('link-title');
            const url = urlInput.value.trim();

            if (!url || titleInput.value) return;

            try {
                const domain = new URL(url).hostname;
                titleInput.value = domain.replace('www.', '').split('.')[0];
            } catch {
                // URL inválida
            }
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('link-url').value = text;
                autoExtractData();
                showToast('URL pegada', 'success');
            } catch {
                showToast('No se pudo acceder al portapapeles', 'error');
            }
        }

        // ============================================
        // GESTIÓN DE CATEGORÍAS
        // ============================================
        function initCategoryIcons() {
            const container = document.getElementById('category-icons');
            if (!container) return;

            container.innerHTML = ICONS.map(icon => `
                <button onclick="selectIcon(this, '${icon}')" class="category-icon-btn w-10 h-10 rounded-lg flex items-center justify-center hover:bg-white/20 transition-all" data-icon="${icon}">
                    <i class="ph ${icon} text-xl"></i>
                </button>
            `).join('');

            // Seleccionar primero por defecto
            const first = container.querySelector('.category-icon-btn');
            if (first) selectIcon(first, ICONS[0]);
        }

        function selectIcon(btn, icon) {
            document.querySelectorAll('.category-icon-btn').forEach(b => {
                b.classList.remove('bg-primary-500', 'text-white');
                b.classList.add('hover:bg-white/20');
            });
            btn.classList.remove('hover:bg-white/20');
            btn.classList.add('bg-primary-500', 'text-white');
            btn.dataset.selected = 'true';
        }

        function getSelectedIcon() {
            const selected = document.querySelector('.category-icon-btn[data-selected="true"]');
            return selected ? selected.dataset.icon : ICONS[0];
        }

        function initCategoryColors() {
            const container = document.getElementById('category-colors');
            if (!container) return;

            container.innerHTML = COLORS.map(color => `
                <button onclick="selectColor(this, '${color}')" class="w-8 h-8 rounded-full border-2 border-white/20 hover:scale-110 transition-all" style="background: ${color}" data-color="${color}"></button>
            `).join('');

            const first = container.querySelector('button');
            if (first) selectColor(first, COLORS[0]);
        }

        function selectColor(btn, color) {
            document.querySelectorAll('#category-colors button').forEach(b => {
                b.classList.remove('border-white', 'scale-110');
                b.classList.add('border-white/20');
            });
            btn.classList.remove('border-white/20');
            btn.classList.add('border-white', 'scale-110');
            btn.dataset.selected = 'true';
        }

        function getSelectedColor() {
            const selected = document.querySelector('#category-colors button[data-selected="true"]');
            return selected ? selected.dataset.color : COLORS[0];
        }

        function saveCategory() {
            const id = document.getElementById('category-id').value;
            const name = document.getElementById('category-name').value.trim();
            const icon = getSelectedIcon();
            const color = getSelectedColor();

            if (!name) {
                showToast('El nombre es requerido', 'error');
                return;
            }

            if (id) {
                const index = state.categories.findIndex(c => c.id === id);
                if (index !== -1) {
                    state.categories[index] = { ...state.categories[index], name, icon, color };
                    showToast('Categoría actualizada', 'success');
                }
            } else {
                state.categories.push({
                    id: crypto.randomUUID(),
                    name,
                    icon,
                    color
                });
                showToast('Categoría creada', 'success');
            }

            saveState();
            closeModal('category-modal');
            renderCategories();
        }

        function editCategory(id) {
            const category = state.categories.find(c => c.id === id);
            if (!category) return;

            document.getElementById('category-id').value = id;
            document.getElementById('category-name').value = category.name;
            
            // Resetear selección de iconos y colores
            document.querySelectorAll('.category-icon-btn').forEach(btn => {
                btn.dataset.selected = btn.dataset.icon === category.icon ? 'true' : 'false';
                if (btn.dataset.selected === 'true') {
                    btn.classList.add('bg-primary-500', 'text-white');
                    btn.classList.remove('hover:bg-white/20');
                } else {
                    btn.classList.remove('bg-primary-500', 'text-white');
                    btn.classList.add('hover:bg-white/20');
                }
            });

            document.querySelectorAll('#category-colors button').forEach(btn => {
                btn.dataset.selected = btn.dataset.color === category.color ? 'true' : 'false';
                if (btn.dataset.selected === 'true') {
                    btn.classList.add('border-white', 'scale-110');
                    btn.classList.remove('border-white/20');
                } else {
                    btn.classList.remove('border-white', 'scale-110');
                    btn.classList.add('border-white/20');
                }
            });

            openModal('category-modal');
        }

        function deleteCategory(id) {
            if (!confirm('¿Eliminar categoría? Los enlaces se moverán a "Todos".')) return;
            
            state.categories = state.categories.filter(c => c.id !== id);
            state.links.forEach(link => {
                if (link.category === id) link.category = 'all';
            });
            
            if (state.currentCategory === id) {
                state.currentCategory = 'all';
            }
            
            saveState();
            renderCategories();
            renderLinks();
            showToast('Categoría eliminada', 'success');
        }

        // ============================================
        // DRAG & DROP
        // ============================================
        function initDragAndDrop() {
            const cards = document.querySelectorAll('[draggable="true"]');
            
            cards.forEach(card => {
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
            });
        }

        function handleDragStart(e) {
            state.draggedItem = this;
            this.classList.add('opacity-50');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('opacity-50');
            state.draggedItem = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (state.draggedItem !== this) {
                const container = document.getElementById('links-container');
                const items = [...container.children];
                const fromIndex = items.indexOf(state.draggedItem);
                const toIndex = items.indexOf(this);
                
                if (fromIndex < toIndex) {
                    container.insertBefore(state.draggedItem, this.nextSibling);
                } else {
                    container.insertBefore(state.draggedItem, this);
                }
            }
        }

        // ============================================
        // IMPORTAR / EXPORTAR
        // ============================================
        function exportData() {
            const data = {
                version: '3.0',
                exportedAt: new Date().toISOString(),
                links: state.links,
                categories: state.categories
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nexus-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Datos exportados', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.links && Array.isArray(data.links)) {
                        state.links = data.links;
                    }
                    if (data.categories && Array.isArray(data.categories)) {
                        state.categories = data.categories;
                    }
                    
                    saveState();
                    renderCategories();
                    renderLinks();
                    showToast('Datos importados', 'success');
                } catch (err) {
                    showToast('Error al importar', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================
        // UTILIDADES
        // ============================================
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            const backdrop = document.getElementById(`${modalId}-backdrop`);
            const content = modal.querySelector('.modal-content-3d');
            
            if (!modal) return;

            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
            
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
            }, 10);

            // Resetear formulario si es modal de link
            if (modalId === 'link-modal' && !document.getElementById('link-id').value) {
                document.getElementById('link-url').value = '';
                document.getElementById('link-title').value = '';
                document.getElementById('link-desc').value = '';
                document.getElementById('link-favorite').checked = false;
                document.getElementById('link-modal-title').textContent = 'Nuevo Enlace';
                
                // Llenar select de categorías
                const catSelect = document.getElementById('link-category');
                catSelect.innerHTML = state.categories
                    .filter(c => c.id !== 'all' && c.id !== 'favorites')
                    .map(c => `<option value="${c.id}">${c.name}</option>`)
                    .join('');
            }

            // Resetear formulario si es modal de categoría
            if (modalId === 'category-modal' && !document.getElementById('category-id').value) {
                document.getElementById('category-name').value = '';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            const backdrop = document.getElementById(`${modalId}-backdrop`);
            
            if (!modal) return;

            backdrop.classList.add('opacity-0');
            modal.classList.remove('modal-active');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                // Limpiar IDs ocultos
                const hiddenId = modal.querySelector('input[type="hidden"]');
                if (hiddenId) hiddenId.value = '';
            }, 400);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            saveState();
            
            ['cards', 'compact', 'buttons'].forEach(m => {
                const btn = document.getElementById(`view-${m}`);
                if (btn) {
                    btn.classList.toggle('text-white', m === mode);
                    btn.classList.toggle('bg-white/20', m === mode);
                    btn.classList.toggle('text-slate-400', m !== mode);
                }
            });
            
            renderLinks();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const icons = {
                success: 'ph-check-circle',
                error: 'ph-warning-circle',
                info: 'ph-info'
            };

            const colors = {
                success: 'from-green-500 to-emerald-500',
                error: 'from-red-500 to-rose-500',
                info: 'from-primary-500 to-secondary-500'
            };

            toast.className = `glass-panel px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-slide-in-3d min-w-[300px] border border-white/20`;
            toast.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br ${colors[type]} flex items-center justify-center">
                    <i class="ph-fill ${icons[type]} text-white"></i>
                </div>
                <span class="font-medium">${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                // navigator.serviceWorker.register('/sw.js');
            }
        }

        // Generar manifest PWA dinámicamente
        function generateManifest() {
            const manifest = {
                name: "Nexus 3D Link Manager",
                short_name: "Nexus 3D",
                description: "Gestor de enlaces moderno en 3D",
                start_url: "/",
                display: "standalone",
                background_color: "#0f0f23",
                theme_color: "#6366f1",
                orientation: "portrait-primary",
                icons: [
                    {
                        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect fill='%236366f1' width='512' height='512' rx='100'/%3E%3Cpath fill='white' d='M256 100l120 80-120 80-120-80z'/%3E%3Cpath fill='white' d='M256 250l120 80-120 80-120-80z'/%3E%3C/svg%3E",
                        sizes: "512x512",
                        type: "image/svg+xml"
                    }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            document.getElementById('pwa-manifest').href = manifestUrl;
        }

        generateManifest();
    </script>
